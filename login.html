<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<meta name="description" content="Admin Login - Styles By Tiwa"/>
<title>Admin Login | Styles By Tiwa</title>
<link rel="icon" type="image/jpeg" href="images/Hero_logo.jpeg">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<style>
:root{--paper:#FDF9F3;--paper-2:#F3ECE1;--ink:#11100F;--ink-2:#5C5752;--line:rgba(17,16,15,0.12);--line-strong:rgba(17,16,15,0.22);--noir:#0B0B0C;--gold:#C9A961;--gold-light:#F5E7B8;--gold-line:rgba(201,169,97,0.28);--ease:cubic-bezier(.76,0,.24,1)}
*{margin:0;padding:0;box-sizing:border-box}html{background:var(--paper)}body{font-family:"Inter",system-ui,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
button{cursor:pointer;font:inherit}
.header{height:80px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;border-bottom:1px solid var(--gold-line);background:rgba(11,11,12,0.96);color:var(--paper)}
.logo{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit}.logo-mark{height:54px;border-radius:12px;border:1px solid rgba(201,169,97,.35);overflow:hidden;background:#0A0A0A}.logo-mark img{height:100%;width:auto;max-width:230px;object-fit:contain;display:block}
main{flex:1;display:grid;place-items:center;padding:48px 20px}
.login-card{width:100%;max-width:400px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:36px 32px;box-shadow:0 20px 50px rgba(0,0,0,.07)}
.login-card h1{font-family:"Bodoni Moda";font-size:32px;letter-spacing:-.03em;line-height:1}
.login-card h1 em{font-family:"Instrument Serif";font-style:italic;font-weight:400}
.login-card p.sub{font-size:13px;color:var(--ink-2);margin:10px 0 24px}
.field{margin-bottom:16px}.field label{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;opacity:.6;margin-bottom:8px}
.field input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;font-size:14px;font-family:inherit;background:var(--paper)}
.field input:focus{outline:none;border-color:var(--ink)}
.btn{width:100%;height:48px;border-radius:999px;background:var(--noir);color:var(--gold-light);border:1px solid rgba(201,169,97,.4);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:#000}
.err{font-size:12px;color:#b3261e;margin-top:12px;min-height:16px}
footer{padding:20px;text-align:center;font-size:11px;opacity:.6}
</style>
</head>
<body>
<header class="header">
  <a href="index.html" class="logo"><span class="logo-mark"><img src="images/Hero_logo.jpeg" alt="Styles By Tiwa"/></span></a>
  <span style="font-size:10px;letter-spacing:.2em;text-transform:uppercase;opacity:.6">Restricted Access</span>
</header>
<main>
  <div class="login-card">
    <h1>Admin <em>Login</em></h1>
    <p class="sub">Sign in to manage the Styles By Tiwa collection</p>
    <div class="field"><label for="email">Email</label><input type="email" id="email" placeholder="you@example.com" autocomplete="email"/></div>
    <div class="field"><label for="password">Password</label><input type="password" id="password" placeholder="••••••••" autocomplete="current-password"/></div>
    <button class="btn" onclick="login()">Login →</button>
    <div class="err" id="err"></div>
  </div>
</main>
<footer style="padding:16px;text-align:center;font-size:10px;opacity:.5;display:flex;justify-content:center;gap:16px;flex-wrap:wrap">
  <span>&copy; <span id="y"></span> Styles By Tiwa</span>
  <a href="privacy-policy.html" style="color:inherit">Privacy Policy</a>
  <a href="terms.html" style="color:inherit">Terms</a>
</footer>
<script>
lucide.createIcons?.();
document.getElementById('y').textContent=new Date().getFullYear();
const supabaseClient=(typeof getSupabaseClient==='function'?getSupabaseClient():supabase.createClient(SUPABASE_URL,SUPABASE_KEY));
async function login(){
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const err=document.getElementById('err'); err.textContent='';
  if(!email||!password){err.textContent='Enter email and password';return}
  if(email.length>254||password.length>256){err.textContent='Invalid credentials';return}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){err.textContent='Please enter a valid email';return}
  // Client-side brute-force throttle: max 5 attempts per 5 minutes
  try{
    const key='sbt_login_attempts';
    const now=Date.now();
    let attempts=[];
    try{ attempts=JSON.parse(sessionStorage.getItem(key)||'[]'); }catch(_){ attempts=[]; }
    attempts=attempts.filter(t=>now-t<5*60*1000);
    if(attempts.length>=5){
      const oldest=Math.min(...attempts);
      const wait=Math.ceil((5*60*1000-(now-oldest))/1000);
      err.textContent='Too many attempts. Try again in '+wait+'s';
      return;
    }
    attempts.push(now);
    sessionStorage.setItem(key, JSON.stringify(attempts));
  }catch(_){}
  const btn=document.querySelector('.btn'); btn.textContent='Signing in…'; btn.disabled=true;
  const {error}=await supabaseClient.auth.signInWithPassword({email,password});
  btn.textContent='Login →'; btn.disabled=false;
  if(error){err.textContent='Login failed. Check credentials and try again.';}
  else{ try{ sessionStorage.removeItem('sbt_login_attempts'); }catch(_){} window.location.href='tiwa-admin-dashboard.html'; }
}
document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
</script>
</body>
</html>
